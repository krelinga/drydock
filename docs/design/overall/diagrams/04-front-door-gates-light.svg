<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-label="A request from a LAN client passes three independent gates: Caddy rejects any Host header other than the configured hostname, the Unix socket is unreachable by any process outside the drydock group, and Drydock rejects requests with no session cookie or a foreign Origin. Only then does a handler run.">
        <defs>
          <marker id="04-front-door-gates-light-ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#48525E"/>
          </marker>
        </defs>

        <rect x="14" y="66" width="112" height="48" rx="4" fill="none" stroke="#48525E" stroke-width="1.3"/>
        <text x="70" y="87" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12" fill="#48525E">LAN client</text>
        <text x="70" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".65">phone / laptop</text>

        <rect x="168" y="54" width="160" height="72" rx="4" fill="none" stroke="#1B6B58" stroke-width="1.5"/>
        <text x="248" y="76" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" fill="#1B6B58">Caddy</text>
        <text x="248" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">terminate TLS</text>
        <text x="248" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">match Host exactly</text>

        <rect x="370" y="66" width="136" height="48" rx="4" fill="none" stroke="#1B6B58" stroke-width="1.5"/>
        <text x="438" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1B6B58">http.sock</text>
        <text x="438" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">0660 root:drydock</text>

        <rect x="548" y="54" width="166" height="72" rx="4" fill="none" stroke="#48525E" stroke-width="1.5"/>
        <text x="631" y="76" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" fill="#48525E">Drydock</text>
        <text x="631" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".7">session cookie</text>
        <text x="631" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".7">Origin allowlist</text>

        <rect x="756" y="66" width="128" height="48" rx="4" fill="none" stroke="#48525E" stroke-width="1.3"/>
        <text x="820" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12" fill="#48525E">handler runs</text>

        <line x1="126" y1="90" x2="164" y2="90" stroke="#48525E" stroke-width="1.2" marker-end="url(#04-front-door-gates-light-ar4)"/>
        <text x="145" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#48525E" opacity=".7">TLS</text>
        <line x1="328" y1="90" x2="366" y2="90" stroke="#48525E" stroke-width="1.2" marker-end="url(#04-front-door-gates-light-ar4)"/>
        <line x1="506" y1="90" x2="544" y2="90" stroke="#48525E" stroke-width="1.2" marker-end="url(#04-front-door-gates-light-ar4)"/>
        <line x1="714" y1="90" x2="752" y2="90" stroke="#48525E" stroke-width="1.2" marker-end="url(#04-front-door-gates-light-ar4)"/>

        <text x="248" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">turns away</text>
        <text x="248" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">any other Host</text>
        <text x="248" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F" opacity=".8">(DNS rebinding)</text>

        <text x="438" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">turns away</text>
        <text x="438" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">every process</text>
        <text x="438" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F" opacity=".8">outside the group</text>

        <text x="631" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">turns away</text>
        <text x="631" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">no cookie, or</text>
        <text x="631" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F" opacity=".8">a foreign Origin</text>

        <line x1="248" y1="130" x2="248" y2="140" stroke="#48525E" stroke-width="1" opacity=".35"/>
        <line x1="438" y1="118" x2="438" y2="140" stroke="#48525E" stroke-width="1" opacity=".35"/>
        <line x1="631" y1="130" x2="631" y2="140" stroke="#48525E" stroke-width="1" opacity=".35"/>
      </svg>
