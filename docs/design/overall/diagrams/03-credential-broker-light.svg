<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-label="Credential flow: git in the container invokes a credential helper, which reads a token from the workspace's bind-mounted Unix socket; the broker signs a JWT with the app private key, requests an installation token scoped to one repository id and a permission subset, caches it for under an hour, and returns it. The token is written to stdout and never to disk.">
        <defs>
          <marker id="03-credential-broker-light-ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#48525E"/>
          </marker>
          <marker id="03-credential-broker-light-ar3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#1B6B58"/>
          </marker>
        </defs>

        <rect x="12" y="46" width="286" height="164" rx="5" fill="none" stroke="#48525E" stroke-width="1.2" stroke-dasharray="4 4" opacity=".5"/>
        <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E" opacity=".7">CONTAINER — no secret at rest</text>

        <rect x="34" y="82" width="106" height="42" rx="4" fill="none" stroke="#48525E" stroke-width="1.3"/>
        <text x="87" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#48525E">git push</text>
        <text x="87" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E" opacity=".65">gh pr create</text>

        <rect x="172" y="82" width="112" height="42" rx="4" fill="none" stroke="#1B6B58" stroke-width="1.4"/>
        <text x="228" y="100" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11.5" fill="#1B6B58">cred helper</text>
        <text x="228" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58">stdout only</text>

        <line x1="140" y1="103" x2="168" y2="103" stroke="#48525E" stroke-width="1.2" marker-end="url(#03-credential-broker-light-ar3)"/>

        <rect x="88" y="152" width="152" height="38" rx="4" fill="none" stroke="#1B6B58" stroke-width="1.2"/>
        <text x="164" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1B6B58">/run/drydock/broker.sock</text>
        <line x1="228" y1="124" x2="192" y2="150" stroke="#1B6B58" stroke-width="1.4" marker-end="url(#03-credential-broker-light-ar3A)"/>

        <!-- broker -->
        <rect x="352" y="76" width="132" height="106" rx="5" fill="none" stroke="#1B6B58" stroke-width="1.6"/>
        <text x="418" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="12.5" fill="#1B6B58">Token broker</text>
        <text x="418" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">socket → repo id</text>
        <text x="418" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">sign JWT</text>
        <text x="418" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">cache &lt; 55 min</text>
        <text x="418" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58" opacity=".85">log the grant</text>

        <line x1="242" y1="168" x2="348" y2="140" stroke="#1B6B58" stroke-width="1.5" marker-end="url(#03-credential-broker-light-ar3A)"/>

        <rect x="352" y="204" width="132" height="32" rx="4" fill="none" stroke="#48525E" stroke-width="1.1"/>
        <text x="418" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">app private key</text>
        <line x1="418" y1="202" x2="418" y2="186" stroke="#48525E" stroke-width="1.1" marker-end="url(#03-credential-broker-light-ar3)"/>

        <!-- github -->
        <rect x="558" y="70" width="200" height="68" rx="4" fill="none" stroke="#48525E" stroke-width="1.3"/>
        <text x="658" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E">POST /app/installations</text>
        <text x="658" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E">/:id/access_tokens</text>
        <text x="658" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".7">repository_ids + permissions</text>

        <line x1="486" y1="108" x2="554" y2="104" stroke="#1B6B58" stroke-width="1.4" marker-end="url(#03-credential-broker-light-ar3A)"/>
        <path d="M658 140 L658 172 L490 172" fill="none" stroke="#1B6B58" stroke-width="1.4" marker-end="url(#03-credential-broker-light-ar3A)"/>
        <text x="576" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58">ghs_… 1 h</text>
      </svg>
