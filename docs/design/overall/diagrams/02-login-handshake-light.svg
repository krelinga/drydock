<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Login handshake: Drydock starts claude on a PTY in the container, scrapes the login URL, shows it in the UI; the user authorizes in a browser and pastes the returned code into the UI; Drydock writes it to the PTY stdin and waits for Login successful, which writes credentials to the shared volume.">
        <defs>
          <marker id="02-login-handshake-light-ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#48525E"/>
          </marker>
          <marker id="02-login-handshake-light-ar2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#1B6B58"/>
          </marker>
        </defs>

        <!-- lanes -->
        <text x="76" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E" opacity=".7">USER</text>
        <text x="286" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E" opacity=".7">DRYDOCK UI + PTY</text>
        <text x="536" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E" opacity=".7">claude IN CONTAINER</text>
        <text x="744" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#48525E" opacity=".7">claude.ai</text>

        <line x1="76" y1="40" x2="76" y2="242" stroke="#48525E" stroke-width="1" opacity=".3"/>
        <line x1="286" y1="40" x2="286" y2="242" stroke="#48525E" stroke-width="1" opacity=".3"/>
        <line x1="536" y1="40" x2="536" y2="242" stroke="#48525E" stroke-width="1" opacity=".3"/>
        <line x1="744" y1="40" x2="744" y2="242" stroke="#48525E" stroke-width="1" opacity=".3"/>

        <!-- 1 -->
        <line x1="286" y1="66" x2="530" y2="66" stroke="#48525E" stroke-width="1.3" marker-end="url(#02-login-handshake-light-ar2)"/>
        <text x="408" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">exec claude on a PTY</text>

        <!-- 2 -->
        <line x1="536" y1="102" x2="292" y2="102" stroke="#48525E" stroke-width="1.3" marker-end="url(#02-login-handshake-light-ar2)"/>
        <text x="414" y="95" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">prints login URL</text>

        <!-- 3 -->
        <line x1="286" y1="134" x2="82" y2="134" stroke="#48525E" stroke-width="1.3" marker-end="url(#02-login-handshake-light-ar2)"/>
        <text x="184" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">renders URL</text>

        <!-- 4 -->
        <path d="M76 156 L76 176 L738 176" fill="none" stroke="#48525E" stroke-width="1.3" marker-end="url(#02-login-handshake-light-ar2)"/>
        <text x="400" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">authorizes in own browser</text>

        <!-- 5 -->
        <path d="M744 196 L744 208 L82 208" fill="none" stroke="#48525E" stroke-width="1.3" marker-end="url(#02-login-handshake-light-ar2)"/>
        <text x="400" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#48525E">shows one-time code</text>

        <!-- 6 -->
        <line x1="76" y1="232" x2="280" y2="232" stroke="#1B6B58" stroke-width="1.5" marker-end="url(#02-login-handshake-light-ar2A)"/>
        <text x="178" y="225" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1B6B58">pastes code into UI</text>

        <!-- 7 -->
        <line x1="286" y1="232" x2="530" y2="232" stroke="#1B6B58" stroke-width="1.5" marker-end="url(#02-login-handshake-light-ar2A)"/>
        <text x="408" y="225" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1B6B58">writes code to PTY stdin</text>

        <!-- 8 -->
        <rect x="424" y="250" width="228" height="26" rx="3" fill="none" stroke="#1B6B58" stroke-width="1.2"/>
        <text x="538" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1B6B58">.credentials.json &#8594; shared volume</text>
      </svg>
