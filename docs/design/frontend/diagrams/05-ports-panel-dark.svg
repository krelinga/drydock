<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The ports panel, three rows. Port 5173, the vite dev server, is enabled: it shows its full preview hostname and carries both declared and observed provenance flags with an on switch. Port 9090 is bound to loopback, so it is greyed, carries the diagnosis to start it with host 0.0.0.0, and has no enable control at all. Port 8080 is declared but not listening, greyed but present with an off switch. A footer notes that discovery never interrupts: no toast and no badge, because a prompt seen whenever a test opens a socket trains the wrong reflex.">
        <defs>
          <marker id="05-ports-panel-dark-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#A6B0BA"/>
          </marker>
        </defs>

        <text x="26" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".6">PORTS · 4 listening · 1 previewed</text>
        <rect x="22" y="34" width="498" height="198" rx="4" fill="none" stroke="#A6B0BA" stroke-width="1.2"/>

        <!-- row 1: previewable -->
        <text x="38" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5DC4A6">5173</text>
        <text x="90" y="62" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11.5" fill="#A6B0BA">vite dev server</text>
        <text x="90" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#5DC4A6">myapp-5173-p2mq.drydock-preview.net</text>
        <rect x="90" y="84" width="54" height="13" rx="2" fill="none" stroke="#A6B0BA" stroke-width=".9" opacity=".45"/>
        <text x="117" y="93.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#A6B0BA" opacity=".7">DECLARED</text>
        <rect x="150" y="84" width="54" height="13" rx="2" fill="none" stroke="#A6B0BA" stroke-width=".9" opacity=".45"/>
        <text x="177" y="93.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#A6B0BA" opacity=".7">OBSERVED</text>
        <rect x="452" y="54" width="48" height="22" rx="11" fill="none" stroke="#5DC4A6" stroke-width="1.4"/>
        <text x="476" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#5DC4A6">on</text>
        <line x1="38" y1="108" x2="504" y2="108" stroke="#A6B0BA" stroke-width="1" opacity=".2"/>

        <!-- row 2: loopback -->
        <text x="38" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A6B0BA" opacity=".45">9090</text>
        <text x="90" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11.5" fill="#A6B0BA" opacity=".45">metrics</text>
        <text x="90" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#D9A15D">listening on loopback — start it with --host 0.0.0.0</text>
        <text x="90" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#D9A15D">to preview it</text>
        <rect x="90" y="166" width="54" height="13" rx="2" fill="none" stroke="#A6B0BA" stroke-width=".9" opacity=".45"/>
        <text x="117" y="175.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#A6B0BA" opacity=".7">OBSERVED</text>
        <line x1="38" y1="190" x2="504" y2="190" stroke="#A6B0BA" stroke-width="1" opacity=".2"/>

        <!-- row 3: declared, not listening -->
        <text x="38" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A6B0BA" opacity=".45">8080</text>
        <text x="90" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11.5" fill="#A6B0BA" opacity=".45">api</text>
        <text x="150" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#A6B0BA" opacity=".55">declared, not listening</text>
        <rect x="452" y="203" width="48" height="22" rx="11" fill="none" stroke="#A6B0BA" stroke-width="1.1" opacity=".5"/>
        <text x="476" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#A6B0BA" opacity=".6">off</text>

        <!-- annotations -->
        <line x1="520" y1="65" x2="556" y2="65" stroke="#A6B0BA" stroke-width="1" opacity=".4" marker-end="url(#05-ports-panel-dark-ar)"/>
        <text x="562" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">the full host is shown, never hidden</text>
        <text x="562" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">behind a friendly label — lookalike</text>
        <text x="562" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">phishing is the residual risk</text>

        <line x1="520" y1="145" x2="556" y2="145" stroke="#D9A15D" stroke-width="1" opacity=".5" marker-end="url(#05-ports-panel-dark-ar)"/>
        <text x="562" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#D9A15D">no enable control at all — not a</text>
        <text x="562" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#D9A15D">disabled one, which reads as "try</text>
        <text x="562" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#D9A15D">again". The bind address is the</text>
        <text x="562" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#D9A15D">diagnosis, so the 502 never happens.</text>

        <line x1="520" y1="214" x2="556" y2="214" stroke="#A6B0BA" stroke-width="1" opacity=".4" marker-end="url(#05-ports-panel-dark-ar)"/>
        <text x="562" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">greyed but present — what makes the</text>
        <text x="562" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">panel useful on a running workspace</text>
        <text x="562" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A6B0BA" opacity=".75">whose dev server is not</text>

        <text x="22" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#5DC4A6">Discovery is ambient, never interruptive. A port appearing changes this panel the next time it is read — no toast,</text>
        <text x="22" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#5DC4A6">no badge, no approval prompt. A prompt that fires whenever a test run opens a socket trains exactly one reflex,</text>
        <text x="22" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#5DC4A6">and it is the wrong one.</text>
      </svg>
