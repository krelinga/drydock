<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Two panels compared. On the left, a UI that renders each card independently shows five cards all reading session degraded, each with its own Restart session server button, none of which can work. On the right, the same fault produces one banner reading signed out, sign in again with a single Sign in to Claude button; the four session-dependent cards below it say waiting on Claude sign-in and carry no action, while a fifth card whose image build failed keeps its own status and its own Rebuild action, because that fault has a different cause.">
        <defs>
          <marker id="06-fleet-override-light-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#48525E"/>
          </marker>
        </defs>

        <text x="22" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".8">a card that only knows about itself</text>
        <text x="470" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58">one cause · one message · one button</text>

        <line x1="450" y1="14" x2="450" y2="300" stroke="#48525E" stroke-width="1" opacity=".22" stroke-dasharray="4 4"/>

        <!-- ===== LEFT: the naive rendering ===== -->
        <rect x="22" y="38" width="400" height="34" rx="3" fill="none" stroke="#9C3729" stroke-width="1.1"/>
        <text x="34" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9C3729">▲ krelinga/drydock · Session degraded</text>
        <rect x="300" y="45" width="112" height="20" rx="3" fill="none" stroke="#9C3729" stroke-width="1"/>
        <text x="356" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#9C3729">Restart server</text>

        <rect x="22" y="80" width="400" height="34" rx="3" fill="none" stroke="#9C3729" stroke-width="1.1"/>
        <text x="34" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9C3729">▲ krelinga/notes · Session degraded</text>
        <rect x="300" y="87" width="112" height="20" rx="3" fill="none" stroke="#9C3729" stroke-width="1"/>
        <text x="356" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#9C3729">Restart server</text>

        <rect x="22" y="122" width="400" height="34" rx="3" fill="none" stroke="#9C3729" stroke-width="1.1"/>
        <text x="34" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9C3729">▲ krelinga/infra · Session degraded</text>
        <rect x="300" y="129" width="112" height="20" rx="3" fill="none" stroke="#9C3729" stroke-width="1"/>
        <text x="356" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#9C3729">Restart server</text>

        <rect x="22" y="164" width="400" height="34" rx="3" fill="none" stroke="#9C3729" stroke-width="1.1"/>
        <text x="34" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9C3729">▲ krelinga/dotfiles · Session degraded</text>
        <rect x="300" y="171" width="112" height="20" rx="3" fill="none" stroke="#9C3729" stroke-width="1"/>
        <text x="356" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#9C3729">Restart server</text>

        <rect x="22" y="206" width="400" height="34" rx="3" fill="none" stroke="#9C3729" stroke-width="1.1"/>
        <text x="34" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9C3729">✕ krelinga/broken · Session degraded</text>
        <rect x="300" y="213" width="112" height="20" rx="3" fill="none" stroke="#9C3729" stroke-width="1"/>
        <text x="356" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#9C3729">Restart server</text>

        <text x="22" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">five buttons, every one of them the wrong action —</text>
        <text x="22" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#95590F">and the last card's real fault is now invisible</text>

        <!-- ===== RIGHT: the fleet override ===== -->
        <rect x="470" y="38" width="410" height="56" rx="3" fill="none" stroke="#9C3729" stroke-width="1.6"/>
        <text x="484" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11.5" fill="#9C3729">▲  Signed out. Sign in again.</text>
        <text x="484" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#9C3729" opacity=".85">the shared credential was cleared — no workspace is at fault</text>
        <rect x="742" y="60" width="124" height="24" rx="3" fill="none" stroke="#9C3729" stroke-width="1.3"/>
        <text x="804" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#9C3729">Sign in to Claude</text>

        <rect x="470" y="104" width="410" height="30" rx="3" fill="none" stroke="#48525E" stroke-width="1" opacity=".55"/>
        <text x="484" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#48525E" opacity=".7">krelinga/drydock · waiting on Claude sign-in</text>

        <rect x="470" y="140" width="410" height="30" rx="3" fill="none" stroke="#48525E" stroke-width="1" opacity=".55"/>
        <text x="484" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#48525E" opacity=".7">krelinga/notes · waiting on Claude sign-in</text>

        <rect x="470" y="176" width="410" height="30" rx="3" fill="none" stroke="#48525E" stroke-width="1" opacity=".55"/>
        <text x="484" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#48525E" opacity=".7">krelinga/infra · waiting on Claude sign-in</text>

        <rect x="470" y="212" width="410" height="30" rx="3" fill="none" stroke="#48525E" stroke-width="1" opacity=".55"/>
        <text x="484" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#48525E" opacity=".7">krelinga/dotfiles · waiting on Claude sign-in</text>

        <!-- the card that is NOT overridden -->
        <rect x="470" y="248" width="410" height="34" rx="3" fill="none" stroke="#95590F" stroke-width="1.4"/>
        <line x1="471.6" y1="249" x2="471.6" y2="281" stroke="#95590F" stroke-width="3"/>
        <text x="486" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#95590F">✕ krelinga/broken · Failed while building · step 9/12</text>
        <rect x="810" y="255" width="58" height="20" rx="3" fill="none" stroke="#95590F" stroke-width="1"/>
        <text x="839" y="269" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#95590F">Rebuild</text>

        <line x1="896" y1="265" x2="884" y2="265" stroke="#95590F" stroke-width="1" opacity=".5"/>

        <text x="470" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58">the override replaces only what the credential actually broke.</text>
        <text x="470" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1B6B58">a build failure is still a build failure, and keeps its own action.</text>

        <text x="22" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#48525E" opacity=".75">Per-card actions that cannot work are not shown disabled — they are replaced by the one action that can. §6.6</text>
      </svg>
