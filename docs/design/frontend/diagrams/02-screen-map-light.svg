        <rect x="476" y="162" width="166" height="18" rx="9" fill="none" stroke="#48525E" stroke-width="1" opacity=".55"/>
        <text x="488" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#48525E" opacity=".55">search 47 repos</text>
        <text x="480" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#48525E" opacity=".7">krelinga/notes</text>
        <text x="480" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#48525E" opacity=".7">krelinga/mediaserve</text>
        <text x="480" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#48525E" opacity=".7">krelinga/dotfiles</text>
        <text x="480" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#48525E" opacity=".7">krelinga/scratch</text>

        <text x="672" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11" fill="#48525E">drydock</text>
        <text x="672" y="73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#1B6B58">running · 3 sessions</text>
