        <text x="64" y="49" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="11" fill="#48525E">Drydock</text>

        <rect x="62" y="66" width="206" height="22" rx="3" fill="none" stroke="#95590F" stroke-width="1.1"/>
