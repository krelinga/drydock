<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="On a phone the app is a single column: a header with a fleet-wide banner slot, a Running section of workspace cards, an All repositories section with search, and a three-item bottom tab bar for Workspaces, Secrets and Settings. On a desktop the same components reflow into a left navigation rail with the list and the workspace detail side by side, so the detail is a route on mobile and a column on desktop.">
        <defs>
          <marker id="02-screen-map-light-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#48525E"/>
          </marker>
        </defs>

        <!-- phone frame -->
        <rect x="50" y="28" width="230" height="300" rx="12" fill="none" stroke="#48525E" stroke-width="1.4"/>
