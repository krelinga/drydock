<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-labelledby="dd-mono-t dd-mono-d">
  <title id="dd-mono-t">Drydock</title>
  <desc id="dd-mono-d">A drained dock basin with battered side walls, holding a container raised clear of the floor on two keel blocks. Single-colour form, inherits currentColor.</desc>

  <!-- Single-colour form: inherits currentColor, for buttons, disabled states,
       print and one-bit favicons.

       The DD is deliberately absent. The letters are a stencil - they read by
       being knocked out of a filled container - and at one colour there is
       nothing for them to be knocked out of. An outlined container with
       same-colour letters inside it is mush by 24px, which is the size this
       form exists to serve. -->

  <!-- basin: battered walls, 109-degree join to a flat floor -->
  <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M3.1 8 8.6 24H23.4L28.9 8"/>

  <!-- keel blocks -->
  <rect fill="currentColor" x="12.6" y="20.9" width="2" height="2.2" rx="0.4"/>
  <rect fill="currentColor" x="17.4" y="20.9" width="2" height="2.2" rx="0.4"/>

  <!-- the container under work: outlined, so the mark stays open at one colour -->
  <rect stroke="currentColor" stroke-width="1.8" x="11.9" y="11.8" width="8.2" height="8.2" rx="1.5"/>
</svg>
