<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-labelledby="dd-bblue-t dd-bblue-d">
  <title id="dd-bblue-t">Drydock</title>
  <desc id="dd-bblue-d">A rounded square blue badge with the Drydock mark knocked out of it: a drained dock basin holding a container on keel blocks, the letters D and D stencilled on the container's face.</desc>
  <style>
    svg{--badge:#1d4ed8;--knock:#f8fafc}
    @media (prefers-color-scheme:dark){svg{--badge:#2563eb}}
    .f-badge{fill:var(--badge)}.s-badge{stroke:var(--badge)}
    .s-knock{stroke:var(--knock)}.f-knock{fill:var(--knock)}
  </style>

  <rect class="f-badge" fill="#1d4ed8" x="1" y="1" width="30" height="30" rx="7.5"/>

  <!-- the mark at 0.78, with every stroke divided by 0.78 so the knockout keeps
       the weight it has at full size -->
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)">
    <path class="s-knock" stroke="#f8fafc" stroke-width="2.56" stroke-linecap="round" stroke-linejoin="round"
          d="M3.1 8 8.6 24H23.4L28.9 8"/>
    <rect class="f-knock" fill="#f8fafc" x="12.6" y="20.9" width="2" height="2.2" rx="0.4"/>
    <rect class="f-knock" fill="#f8fafc" x="17.4" y="20.9" width="2" height="2.2" rx="0.4"/>
    <rect class="f-knock" fill="#f8fafc" x="11" y="10.9" width="10" height="10" rx="1.6"/>
    <path class="s-badge" stroke="#1d4ed8" stroke-width="1.03" stroke-linejoin="round"
          d="M12.5 18.1V13.7h0.5a2.2 2.2 0 0 1 0 4.4H12.5"/>
    <path class="s-badge" stroke="#1d4ed8" stroke-width="1.03" stroke-linejoin="round"
          d="M16.8 18.1V13.7h0.5a2.2 2.2 0 0 1 0 4.4H16.8"/>
  </g>
</svg>
