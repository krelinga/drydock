<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-labelledby="dd-twin-t dd-twin-d">
  <title id="dd-twin-t">Drydock</title>
  <desc id="dd-twin-d">A drained dock basin with battered side walls, holding two container blocks shaped as the letters D and D, each raised clear of the floor on a keel block.</desc>
  <style>
    svg{--ink:#0f172a;--accent:#1d4ed8;--bg:#ffffff}
    @media (prefers-color-scheme:dark){svg{--ink:#e2e8f0;--accent:#60a5fa;--bg:#0b1220}}
    .s-ink{stroke:var(--ink)}.f-ink{fill:var(--ink)}.f-acc{fill:var(--accent)}
  </style>

  <!-- basin: battered walls, 109-degree join to a flat floor, no right angle anywhere -->
  <path class="s-ink" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M3.1 8 8.6 24H23.4L28.9 8"/>

  <!-- keel blocks, one centred under each vessel -->
  <rect class="f-ink" fill="#0f172a" x="11.8" y="20.9" width="2" height="2.2" rx="0.4"/>
  <rect class="f-ink" fill="#0f172a" x="18.2" y="20.9" width="2" height="2.2" rx="0.4"/>

  <!-- two vessels under work, drawn as D and D: the dock holds more than one workspace -->
  <path class="f-acc" fill="#1d4ed8" fill-rule="evenodd"
        d="M10 12.9H11.55A4 4 0 0 1 11.55 20.9H10ZM11.7 14.7H11.85A2.2 2.2 0 0 1 11.85 19.1H11.7Z"/>
  <path class="f-acc" fill="#1d4ed8" fill-rule="evenodd"
        d="M16.45 12.9H18A4 4 0 0 1 18 20.9H16.45ZM18.15 14.7H18.3A2.2 2.2 0 0 1 18.3 19.1H18.15Z"/>
</svg>
