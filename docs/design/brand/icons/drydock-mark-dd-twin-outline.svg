<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-labelledby="dd-twino-t dd-twino-d">
  <title id="dd-twino-t">Drydock</title>
  <desc id="dd-twino-d">A drained dock basin with battered side walls, holding two outlined container blocks shaped as the letters D and D, each raised clear of the floor on a keel block.</desc>
  <style>
    svg{--ink:#0f172a;--accent:#1d4ed8;--bg:#ffffff}
    @media (prefers-color-scheme:dark){svg{--ink:#e2e8f0;--accent:#60a5fa;--bg:#0b1220}}
    .s-ink{stroke:var(--ink)}.f-ink{fill:var(--ink)}.s-acc{stroke:var(--accent)}
  </style>

  <!-- basin: battered walls, 109-degree join to a flat floor, no right angle anywhere -->
  <path class="s-ink" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M3.1 8 8.6 24H23.4L28.9 8"/>

  <!-- keel blocks, one centred under each vessel -->
  <rect class="f-ink" fill="#0f172a" x="11.7" y="20.9" width="2" height="2.2" rx="0.4"/>
  <rect class="f-ink" fill="#0f172a" x="18.3" y="20.9" width="2" height="2.2" rx="0.4"/>

  <!-- the same two vessels, outlined: the counters stay open so the letters read as letters -->
  <path class="s-acc" stroke="#1d4ed8" stroke-width="1.5" stroke-linejoin="round"
        d="M10.72 20.15V13.65h0.68a3.25 3.25 0 0 1 0 6.5H10.72"/>
  <path class="s-acc" stroke="#1d4ed8" stroke-width="1.5" stroke-linejoin="round"
        d="M17.35 20.15V13.65h0.68a3.25 3.25 0 0 1 0 6.5H17.35"/>
</svg>
