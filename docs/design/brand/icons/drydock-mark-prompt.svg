<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-labelledby="dd-prompt-t dd-prompt-d">
  <title id="dd-prompt-t">Drydock</title>
  <desc id="dd-prompt-d">A drained dock basin with stepped side walls, holding a dev container raised on keel blocks, a shell prompt showing on its face.</desc>
  <style>
    svg{--ink:#0f172a;--accent:#1d4ed8;--bg:#ffffff}
    @media (prefers-color-scheme:dark){svg{--ink:#e2e8f0;--accent:#60a5fa;--bg:#0b1220}}
    .s-ink{stroke:var(--ink)}.f-ink{fill:var(--ink)}.s-acc{stroke:var(--accent)}.f-bg{fill:var(--bg)}
  </style>

  <!-- basin: inner profile, one altar step per wall, drained floor -->
  <path class="s-ink" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M3.5 8V15.5h5V24h15v-8.5h5V8"/>

  <!-- keel blocks -->
  <rect class="f-ink" fill="#0f172a" x="12.6" y="20.9" width="2" height="2.2" rx="0.4"/>
  <rect class="f-ink" fill="#0f172a" x="17.4" y="20.9" width="2" height="2.2" rx="0.4"/>

  <!-- the dev container, with a live shell on its face -->
  <rect class="s-acc f-bg" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6" x="11.8" y="11.7" width="8.4" height="8.4" rx="1.5"/>
  <path class="s-ink" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M13.65 13.95 15.35 15.85l-1.7 1.9"/>
  <path class="s-ink" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" d="M16.65 17.75h1.7"/>
</svg>
