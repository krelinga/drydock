# Every test that can run on a GitHub-hosted runner, on every PR and every push
# to main. Make the three jobs required checks so nothing merges red.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Caddy the conformance test runs. The devcontainer's feature takes the
  # latest; bump this when a rebuild moves it.
  CADDY_VERSION: 2.11.7

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Caddy
        run: |
          base=https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION
          tarball=caddy_${CADDY_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "$base/$tarball" -fsSLO "$base/caddy_${CADDY_VERSION}_checksums.txt"
          grep " $tarball\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin caddy
      # The broker's in-container clients are tested over both transports
      # they support: socat, and OpenBSD netcat's -U (preinstalled).
      # The container tier runs real `devcontainer up` (test/container), so
      # DRYDOCK_REQUIRE_DOCKER needs the CLI too, pinned to the corpus's version.
      - name: Install the devcontainer CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: Install socat
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends socat
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      # Without DRYDOCK_REQUIRE_CADDY a missing caddy is a skip, which here
      # would be a silent pass of the one test of the LAN-facing surface.
      - run: go test ./...
        env:
          DRYDOCK_REQUIRE_CADDY: "1"
          # And the container tier (test/container) needs the runner's Docker.
          DRYDOCK_REQUIRE_DOCKER: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Types, unit tests, the size budget, and that the committed
      # internal/web/dist is exactly what these sources build.
      - run: npm run check

  # The browser tier (testing §10): real Chromium, real Caddy on the shipped
  # Caddyfile, the real `drydock serve`, and a throwaway CA trusted through
  # NSS — never ignoreHTTPSErrors.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Caddy
        run: |
          base=https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION
          tarball=caddy_${CADDY_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "$base/$tarball" -fsSLO "$base/caddy_${CADDY_VERSION}_checksums.txt"
          grep " $tarball\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin caddy
      # certutil: how the test CA gets into Chromium's NSS store (Spike 04).
      - name: Install certutil
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libnss3-tools
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: test/browser/run.sh
      # A failed test leaves a Playwright trace: the page, the network, the
      # console, step by step. `npx playwright show-trace <zip>` opens one.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test/browser/test-results/
          retention-days: 14

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Real systemd, the official Caddy package, real TLS, in a privileged
      # container: install, re-run, upgrade, rollback, previews, refusals.
      - run: test/install/run.sh

  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The devcontainer CLI pinned to what the corpus was recorded against.
      - run: npm install -g @devcontainers/cli@0.89.0
      # The official harness (testing §6.5), one scenario per image and
      # option set. Scenarios only: the autogenerated test would run the
      # Feature with requireBroker on and no broker, which fails by design.
      - run: devcontainer features test --project-folder feature --skip-autogenerated
