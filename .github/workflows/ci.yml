# Every test that can run on a GitHub-hosted runner, on every PR and every push
# to main. Make the three jobs required checks so nothing merges red.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job has a timeout far under GitHub's default of 360 minutes, a few
# times its usual length.
jobs:
  # The suite's tools and commands live in .github/actions/go-suite, which the
  # release workflow runs too, so a release is held to exactly this job.
  go:
    runs-on: ubuntu-latest
    # About 5–6 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # test/docs reads the commits since the last release
      - uses: ./.github/actions/go-suite
        with:
          # The squash commit's subject, for release-please's next version.
          # Retitling a PR re-runs only pr-title, not this: push again, or
          # main's own run catches it after the merge.
          pr-title: ${{ github.event.pull_request.title }}

  web:
    runs-on: ubuntu-latest
    # Under a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Types, unit tests, the size budget, and that the committed
      # internal/web/dist is exactly what these sources build.
      - run: npm run check

  # The browser tier (testing §10): real Chromium, real Caddy on the shipped
  # Caddyfile, the real `drydock serve`, and a throwaway CA trusted through
  # NSS — never ignoreHTTPSErrors.
  #
  # It runs in Playwright's own image, which carries the three browsers and
  # every library they need. On the bare runner, `playwright install
  # --with-deps` took 6½ minutes at the 90th percentile and 42 at worst, all
  # of it apt (181 packages from a mirror that falls back package by package):
  # its browser downloads take 16 seconds. The tag must be
  # web/package-lock.json's @playwright/test exactly, since an image carries
  # the builds its one version expects, and test/docs fails when the two
  # differ; the digest pins the bytes.
  browser:
    runs-on: ubuntu-latest
    # About 1½ minutes, the image pull included.
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Playwright's documented setting for its image. Not for /dev/shm:
      # Playwright starts Chromium with --disable-dev-shm-usage, so Docker's
      # 64 MB there is never what Chromium sizes against. Kept because it is
      # the configuration the image is tested under, and on a VM that lives
      # for one job the host IPC namespace holds nothing to reach.
      options: --ipc=host
    # certutil's .deb, pinned: the image's libnss3 is fixed by its digest, and
    # libnss3-tools needs only libnss3 >= 2:3.94. Launchpad's +files URL is
    # permanent (the archive's pool drops a version once it is superseded),
    # and the SHA-256 is the one noble-updates' signed Packages index lists.
    env:
      NSS_TOOLS_URL: https://launchpad.net/ubuntu/+archive/primary/+files/libnss3-tools_3.98-1ubuntu0.2_amd64.deb
      NSS_TOOLS_SHA256: e5b42390b02c21851bc04e9557ec48539a913f9b09637220c4b1db0d1386b3fb
      NSS_TOOLS_DIR: /opt/nss-tools
    steps:
      - uses: actions/checkout@v5
      # The same Go and the same pinned Caddy as the go job. The job is root
      # here, and the image has neither.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Caddy
        run: .github/actions/go-suite/install-caddy.sh
      # certutil: how the test CA gets into Chromium's NSS store (Spike 04).
      # The image's one missing package, fetched as one file and no apt
      # mirror: `apt-get update` alone is 33 MB of indices from the runner's
      # Azure mirror. The cache keeps a warm run off the network entirely.
      #
      # The cache is restored and saved explicitly, not by actions/cache's
      # post step: that runs after npm ci and the tier, as pwuser, and what it
      # saved is dpkg -i'd as root by every later run. So the entry is saved
      # right after the download, before pwuser runs anything, from a root-
      # owned directory outside the workspace pwuser is handed. And the
      # checksum is checked again on every run before dpkg -i: the pinned hash
      # is in this file, not in the cache.
      - uses: actions/cache/restore@v4
        id: nss-tools
        with:
          path: ${{ env.NSS_TOOLS_DIR }}
          key: libnss3-tools-${{ env.NSS_TOOLS_SHA256 }}
      - name: Fetch certutil
        if: steps.nss-tools.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          install -d -m 0755 "$NSS_TOOLS_DIR"
          curl -fsSL --retry 3 --max-time 60 -o "$NSS_TOOLS_DIR/libnss3-tools.deb" "$NSS_TOOLS_URL"
          echo "$NSS_TOOLS_SHA256  $NSS_TOOLS_DIR/libnss3-tools.deb" | sha256sum -c -
      - uses: actions/cache/save@v4
        if: steps.nss-tools.outputs.cache-hit != 'true'
        with:
          path: ${{ env.NSS_TOOLS_DIR }}
          key: libnss3-tools-${{ env.NSS_TOOLS_SHA256 }}
      - name: Install certutil
        run: |
          echo "$NSS_TOOLS_SHA256  $NSS_TOOLS_DIR/libnss3-tools.deb" | sha256sum -c -
          dpkg -i "$NSS_TOOLS_DIR/libnss3-tools.deb"
          command -v certutil
      # The tier runs as the image's pwuser, never as root: Drydock refuses to
      # run the login as root (login.spec.ts), and a root browser is not what
      # an operator runs. pwuser is uid 1001, the runner's own, so the files
      # it writes are the runner's outside the container too. HOME is the
      # job's /github/home, where setup-go restored the Go caches.
      - name: Hand the workspace to pwuser
        run: chown -R pwuser:pwuser "$GITHUB_WORKSPACE" "$HOME"
      - run: npm ci
        working-directory: web
        shell: setpriv --reuid=pwuser --regid=pwuser --init-groups bash -e {0}
      # Firefox and WebKit run engines.spec.ts: v0.2.1's UI sent `Origin: null`
      # from Safari, which Chromium alone could never have shown.
      - run: test/browser/run.sh
        shell: setpriv --reuid=pwuser --regid=pwuser --init-groups bash -e {0}
      # A failed test leaves a Playwright trace: the page, the network, the
      # console, step by step. `npx playwright show-trace <zip>` opens one.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test/browser/test-results/
          retention-days: 14

  installer:
    runs-on: ubuntu-latest
    # About 2–3 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Real systemd, the official Caddy package, real TLS, in a privileged
      # container: install, re-run, upgrade, rollback, previews, refusals.
      - run: test/install/run.sh

  feature:
    runs-on: ubuntu-latest
    # About 10–11 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The devcontainer CLI pinned to what the corpus was recorded against.
      - run: npm install -g @devcontainers/cli@0.89.0
      # Each scenario's shared volume, prepared as Drydock's step 4 prepares
      # one (design §7.1): without it, ubuntu-bare's remote user — moved to
      # this runner's uid by the CLI — would be refused, as it was before.
      - run: feature/prepare-test-volumes.sh
      # The official harness (testing §6.5), one scenario per image and
      # option set. Scenarios only: the autogenerated test would run the
      # Feature with requireBroker on and no broker, which fails by design.
      - run: devcontainer features test --project-folder feature --skip-autogenerated
      # The builds that must fail (testing §6.5): each of §2.1's five
      # variables, a missing or competing credential volume, a root remote
      # user — each a real `devcontainer up` that has to fail naming why,
      # beside a baseline that has to come up. The harness above cannot
      # express a scenario that should fail; see the script's header.
      - run: feature/expect-fail/run.sh
