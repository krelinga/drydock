# release-please keeps one release PR open, built from the conventional-commit
# subjects merged since the last release; merging it tags vX.Y.Z and creates
# the GitHub Release. The assets are built here rather than in a tag-triggered
# workflow because tags pushed with GITHUB_TOKEN do not trigger other workflows.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The release is what the README's one-liner installs; a failing suite
      # must not reach it. No Node: the UI ships prebuilt in internal/web/dist.
      - run: go vet ./... && go test ./...

      # Fixed asset names, so releases/latest/download/<name> always resolves.
      # The tarballs carry the binary, install.sh and the Caddy files;
      # install.sh is also uploaded on its own, stamped with this tag, for the
      # one-liner.
      - run: deploy/package.sh "$TAG" dist amd64 arm64
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

      - run: gh release upload "$TAG" dist/* --clobber
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
