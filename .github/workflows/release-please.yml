# release-please keeps one release PR open, built from the conventional-commit
# subjects merged since the last release; merging it tags vX.Y.Z and creates
# the GitHub Release. The assets are built here rather than in a tag-triggered
# workflow because tags pushed with GITHUB_TOKEN do not trigger other workflows.
#
# The Release is created as a DRAFT (release-please-config.json: "draft") and
# stays one until its assets are uploaded and the README's one-liner has
# installed them: only then does `publish` make it public and "Latest". A
# failure anywhere before that leaves a draft nobody but the maintainers can
# see, and releases/latest keeps pointing at the previous, working release —
# never at a release with no files, or broken ones.
#
# Drafts get no tag from GitHub until they are published, and release-please
# finds its previous release by the tag's commit, so "force-tag-creation" has
# it push the tag itself when it creates the draft.
#
# Resuming a draft. `gh run rerun --failed` re-runs with the workflow file the
# run started with, so it only helps a transient failure. When the fix is to
# this workflow or to .github/actions, merge it, then run the fixed workflow
# against the existing draft:
#   gh workflow run release-please.yml --ref main -f tag=vX.Y.Z
# That skips release-please and runs test, assets, verify and publish on the
# code at the tag, with main's workflow and test environment: test's
# .github/actions and verify's test/install both come from the workflow's own
# commit. It refuses a tag whose release is not a draft, so it can never touch
# a published release.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Resume this draft release (vX.Y.Z): test, upload, verify and publish it."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created || steps.resume.outputs.released }}
      tag: ${{ steps.rp.outputs.tag_name || steps.resume.outputs.tag }}
    steps:
      - id: rp
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: resume
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3, not $TAG" >&2; exit 1; }
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "$TAG is not a draft; refusing to resume a release that is already public" >&2; exit 1; }
          # The code tested and packaged is the tag's, so the tag must exist.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha
          echo released=true >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  # The release is what the README's one-liner installs; a failing suite must
  # not reach it. This is CI's `go` job exactly: both run
  # .github/actions/go-suite. The action is taken from this workflow's own
  # commit (the second checkout), not from the tag, so a resumed draft is
  # tested in the environment its fix put in place.
  test:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0 # go-suite's test/docs reads the history since the last release
      - uses: actions/checkout@v5
        with:
          path: .workflow
          sparse-checkout: .github/actions
      - uses: ./.workflow/.github/actions/go-suite

  assets:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Fixed asset names, so releases/latest/download/<name> always resolves.
      # The tarballs carry the binary, install.sh and the Caddy files;
      # install.sh is also uploaded on its own, stamped with this tag, for the
      # one-liner. No Node: the UI ships prebuilt in internal/web/dist.
      - run: deploy/package.sh "$TAG" dist amd64
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

      # To the draft: gh finds a draft by its pending tag. Never to a public
      # release, whose files the one-liner may be serving.
      - run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "$TAG is not a draft; refusing to replace a public release's files" >&2; exit 1; }
          gh release upload "$TAG" dist/* --clobber
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}

  # The README's one-liner against what was just uploaded, while the release
  # is still a draft: the assets are downloaded back from it and served
  # locally the way GitHub serves a published release (test/install/live.sh
  # --dir), on a fresh host and as an upgrade of the release that is Latest
  # now. The bytes installed are the bytes that will be published. The
  # harness is test/install from this workflow's own commit, not the tag's:
  # it tests the downloaded assets, not the tag's source, and its Dockerfile
  # (unpinned Debian, Caddy's live apt repository) is the part most likely to
  # need a fix that a resumed draft must pick up.
  verify:
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    permissions:
      # A draft release is visible only with push access.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: test/install
      - name: Download the draft's assets
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "$TAG is not a draft; refusing to verify a release that is already public" >&2; exit 1; }
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          # Exactly the three fixed names the README and the installer use.
          [ "$(ls | sort | tr '\n' ' ')" = "SHA256SUMS drydock_linux_amd64.tar.gz install.sh " ] ||
            { echo "unexpected assets: $(ls)" >&2; exit 1; }
          sha256sum -c SHA256SUMS
          grep -qx "RELEASE_VERSION=\"$TAG\"" install.sh
      - run: test/install/live.sh --dir "$RUNNER_TEMP/assets" "$TAG"
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

  # Only now does the release become public and "Latest". Then the public URL
  # the README uses must serve exactly what was verified; if it does not, the
  # release goes back to being a draft, so releases/latest falls back to the
  # previous release rather than staying on this one.
  publish:
    needs: [release-please, assets, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release and mark it Latest
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Check the README's URL serves it, or withdraw it
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir want
          latest="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          for _ in $(seq 1 12); do
            if curl -fsSL "$latest/install.sh" | grep -qx "RELEASE_VERSION=\"$TAG\"" &&
              [ "$(curl -fsSL "$latest/SHA256SUMS")" = "$(cat want/SHA256SUMS)" ]; then
              echo "releases/latest serves $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "releases/latest does not serve $TAG; returning it to a draft" >&2
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          exit 1
