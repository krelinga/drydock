# The Go suite's environment and its commands, in one place. CI's `go` job and
# the release workflow's `test` job both run this, so the suite a release must
# pass is the suite every PR passed, by construction rather than by a comment
# asking someone to keep two lists in step. (They drifted once: socat reached
# ci.yml with the broker in #16 and never reached the release job, so v0.2.0's
# release failed the socat half of the broker client tests.)
#
# Expects the code under test checked out at the workspace root, with its
# history (fetch-depth: 0): test/docs reads the commits since the last
# release. Its tools:
#   Go          from go.mod
#   Caddy       pinned in install-caddy.sh, which the browser job also runs;
#               the devcontainer's feature takes the latest, so bump it when
#               a rebuild moves it
#   devcontainer CLI   the container tier runs real `devcontainer up`, pinned
#               to the corpus's version
#   socat       the broker's in-container clients are tested over both
#               transports they support: socat, and OpenBSD netcat's -U
#               (preinstalled on the runner)
# and the runner's own Docker, for the container tier.
name: go-suite
description: Install the Go suite's tools and run gofmt, go vet and go test with every DRYDOCK_REQUIRE_* flag CI sets.

inputs:
  pr-title:
    description: "A pull request's title: the squash commit release-please will read, for test/docs's check that the deploy docs name only real or pending releases. Empty outside a PR."
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    # The pin is in the script, which the browser job runs too.
    - name: Install Caddy
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install-caddy.sh"'

    - name: Install the devcontainer CLI
      shell: bash
      run: npm install -g @devcontainers/cli@0.89.0

    # The broker clients' two transports: socat, and OpenBSD nc where socat
    # is absent. Named rather than left to the runner image, since
    # DRYDOCK_REQUIRE_TRANSPORTS fails the suite without either.
    - name: Install socat and nc
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends socat netcat-openbsd

    - name: gofmt
      shell: bash
      run: test -z "$(gofmt -l . | tee /dev/stderr)"

    - name: go vet
      shell: bash
      run: go vet ./...

    # Without DRYDOCK_REQUIRE_CADDY a missing caddy is a skip, which would be a
    # silent pass of the one test of the LAN-facing surface; likewise Docker
    # and the container tier (test/container), and the commits since the last
    # release that test/docs reads (the checkout needs fetch-depth: 0), and
    # socat and nc, without which the broker's argv sweep is skipped.
    - name: go test
      shell: bash
      env:
        DRYDOCK_REQUIRE_CADDY: "1"
        DRYDOCK_REQUIRE_DOCKER: "1"
        DRYDOCK_REQUIRE_RELEASE_HISTORY: "1"
        DRYDOCK_REQUIRE_TRANSPORTS: "1"
        DRYDOCK_PR_TITLE: ${{ inputs.pr-title }}
      run: go test ./...
